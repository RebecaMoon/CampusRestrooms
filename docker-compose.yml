
services:
  # ==========================================
  # Base de datos PostgreSQL
  # ==========================================
  db:
    image: postgres:17
    container_name: campusrestrooms-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME:-campusrestrooms}
      POSTGRES_USER: ${DB_USER:-campus_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # Backend Flask
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campusrestrooms-backend
    restart: unless-stopped

    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-campusrestrooms}
      DB_USER: ${DB_USER:-campus_admin}
      DB_PASSWORD: ${DB_PASSWORD}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY}
      FLASK_DEBUG: "false"
      CORS_ORIGINS: http://localhost

    depends_on:
      db:
        condition: service_healthy

  # ==========================================
  # Frontend React + Nginx
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campusrestrooms-frontend
    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      - backend

volumes:
  postgres_data:
